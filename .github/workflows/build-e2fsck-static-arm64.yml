name: Build ARM64 e2fsck static

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Configure apt sources for arm64 ports
        shell: bash
        run: |
          set -euxo pipefail

          echo "Limit default Ubuntu sources to amd64 only"
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources

          echo "Add Ubuntu ports source for arm64"
          sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security noble-backports
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo dpkg --add-architecture arm64
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update

      - name: Download ARM64 e2fsck-static
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p work out

          cd work

          apt-get download e2fsck-static:arm64

          DEB="$(ls e2fsck-static_*_arm64.deb | head -n 1)"
          echo "DEB=$DEB"

          mkdir extract
          dpkg-deb -x "$DEB" extract

          echo "Extracted files:"
          find extract -type f | sort

          BIN="$(find extract -type f -name 'e2fsck.static' | head -n 1)"
          test -n "$BIN"

          cp "$BIN" ../out/e2fsck.static
          chmod +x ../out/e2fsck.static

          file ../out/e2fsck.static
          sha256sum ../out/e2fsck.static > ../out/e2fsck.static.sha256

          ls -lh ../out

      - name: Upload e2fsck static artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2fsck-static-arm64
          path: out/**
          if-no-files-found: error
          retention-days: 7

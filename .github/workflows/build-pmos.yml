name: Build postmarketOS for Galaxy S8 Plus dream2lte

run-name: "pmOS S8+ ${{ github.event.inputs.ui }} OPENRC-SECTOR4096-NODEBUG-V2 #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "User interface"
        required: true
        default: "console"
        type: choice
        options:
          - console
          - xfce4
          - phosh

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          sudo apt clean
          df -h

      - name: Install dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo sed -i 's|http://security.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          sudo apt-get update \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30

          sudo apt-get install -y --no-install-recommends \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            zip \
            rsync \
            openssh-client \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            android-tools-adb \
            android-tools-fastboot

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Initialize pmbootstrap with defaults
        run: |
          yes "" | pmbootstrap --details-to-stdout init

      - name: Configure target device
        run: |
          pmbootstrap config device samsung-dream
          pmbootstrap config kernel dream2lte
          pmbootstrap config user duy
          pmbootstrap config ui "${{ github.event.inputs.ui }}"
          pmbootstrap config systemd never || true
          pmbootstrap config hostname s8plus-pmos
          pmbootstrap config locale en_US.UTF-8
          pmbootstrap config timezone Asia/Ho_Chi_Minh
          pmbootstrap config jobs 4
          pmbootstrap config ccache_size 0
          pmbootstrap config extra_packages device-samsung-dream-nonfree-firmware
          pmbootstrap config build_pkgs_on_install True || true
          pmbootstrap config ssh_keys False || true

      - name: Patch samsung-dream sector size NODEBUG
        shell: bash
        run: |
          set -euxo pipefail

          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"

          DEVICEINFO="$(find "$PMAPORTS/device" -path "*/device-samsung-dream/deviceinfo" -print -quit)"
          APKBUILD="$(find "$PMAPORTS/device" -path "*/device-samsung-dream/APKBUILD" -print -quit)"

          test -n "$DEVICEINFO"
          test -n "$APKBUILD"

          echo "DEVICEINFO=$DEVICEINFO"
          echo "APKBUILD=$APKBUILD"

          echo "Before patch:"
          grep -n "deviceinfo_rootfs_image_sector_size\|deviceinfo_kernel_cmdline" "$DEVICEINFO" || true

          if grep -q '^deviceinfo_rootfs_image_sector_size=' "$DEVICEINFO"; then
            sed -i 's|^deviceinfo_rootfs_image_sector_size=.*|deviceinfo_rootfs_image_sector_size="4096"|' "$DEVICEINFO"
          else
            echo 'deviceinfo_rootfs_image_sector_size="4096"' >> "$DEVICEINFO"
          fi

          if grep -q '^deviceinfo_kernel_cmdline=' "$DEVICEINFO"; then
            sed -i 's|^deviceinfo_kernel_cmdline=.*|deviceinfo_kernel_cmdline="loglevel=7 rootwait PMOS_SECTOR4096_NODEBUG_V2"|' "$DEVICEINFO"
          else
            echo 'deviceinfo_kernel_cmdline="loglevel=7 rootwait PMOS_SECTOR4096_NODEBUG_V2"' >> "$DEVICEINFO"
          fi

          echo "After patch:"
          grep -n "deviceinfo_rootfs_image_sector_size\|deviceinfo_kernel_cmdline\|PMOS_SECTOR4096_NODEBUG_V2" "$DEVICEINFO" || true

          sed -i 's/^pkgrel=.*/pkgrel=9999/' "$APKBUILD"

          pmbootstrap --details-to-stdout checksum device-samsung-dream
          pmbootstrap --details-to-stdout build --force --arch=aarch64 device-samsung-dream

          echo "Verify real device APK:"
          APK="$(find "$HOME/.local/var/pmbootstrap/packages" -type f \
            | grep '/aarch64/device-samsung-dream-[0-9].*\.apk$' \
            | sort \
            | tail -n 1)"

          echo "APK=$APK"
          test -n "$APK"

          rm -rf /tmp/check-device-apk
          mkdir -p /tmp/check-device-apk
          tar -xzf "$APK" -C /tmp/check-device-apk

          grep -Rsn 'deviceinfo_rootfs_image_sector_size="4096"\|PMOS_SECTOR4096_NODEBUG_V2' /tmp/check-device-apk || {
            echo "ERROR: real device package does not contain sector/cmdline patch"
            exit 1
          }

      - name: Show pmbootstrap status and config
        run: |
          pmbootstrap status || true
          pmbootstrap config || true

      - name: Build Android recovery ZIP
        run: |
          pmbootstrap --details-to-stdout install \
            --zap \
            --sector-size 4096 \
            --android-recovery-zip \
            --recovery-install-partition=data \
            --no-fde \
            --password "123456"

      - name: Verify generated boot image NODEBUG
        shell: bash
        run: |
          set -euxo pipefail

          found_good=0
          found_bad=0

          while IFS= read -r f; do
            echo "=== $f ==="
            file "$f" || true

            if grep -a -q 'PMOS_SECTOR4096_NODEBUG_V2' "$f"; then
              grep -aH 'PMOS_SECTOR4096_NODEBUG_V2' "$f"
              found_good=1
            fi

            if grep -a -q 'pmos.debug-shell\|PMOS_NO_OUTPUT_REDIRECT\|root=/dev/loop0p2\|pmos_root=/dev/loop0p2' "$f"; then
              grep -aH 'pmos.debug-shell\|PMOS_NO_OUTPUT_REDIRECT\|root=/dev/loop0p2\|pmos_root=/dev/loop0p2' "$f"
              found_bad=1
            fi
          done < <(
            find "$HOME/.local/var/pmbootstrap" -type f \
              \( -name 'boot.img' -o -name 'initramfs' -o -name 'initramfs-extra' \) \
              ! -path '*/cache_git/*' \
              ! -path '*/pmaports/*' \
              | sort
          )

          test "$found_good" -eq 1
          test "$found_bad" -eq 0

      - name: Export files
        run: |
          mkdir -p out
          pmbootstrap export out
          find out -maxdepth 2 -type f -print
          ls -lh out

      - name: Rename and mark OPENRC NODEBUG V2 artifact
        shell: bash
        run: |
          set -euxo pipefail
          cd out

          test -f ./pmos-samsung-dream.zip

          mv ./pmos-samsung-dream.zip ./pmos-samsung-dream-OPENRC-SECTOR4096-NODEBUG-V2.zip

          {
            echo "OPENRC_BUILD=YES"
            echo "SYSTEMD=NEVER"
            echo "SECTOR4096_NODEBUG_BUILD=YES"
            echo "SECTOR_SIZE=4096"
            echo "NO_PMOS_DEBUG_SHELL=YES"
            echo "NO_PMOS_NO_OUTPUT_REDIRECT=YES"
            echo "NO_ROOT_LOOP0P2_CMDLINE=YES"
            echo "NODEBUG_MARKER=PMOS_SECTOR4096_NODEBUG_V2"
            echo "RUN_ID=${{ github.run_id }}"
            echo "RUN_NUMBER=${{ github.run_number }}"
            echo "UI=${{ github.event.inputs.ui }}"
            echo "DATE_UTC=$(date -u)"
          } > ./BUILD_MARKER_OPENRC_SECTOR4096_NODEBUG_V2.txt

          find . -maxdepth 1 -type f -print
          ls -lh

      - name: Upload postmarketOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-samsung-dream2lte-${{ github.event.inputs.ui }}-OPENRC-SECTOR4096-NODEBUG-V2
          path: out/**
          if-no-files-found: error
          retention-days: 7

name: Build postmarketOS for Galaxy S8 Plus dream2lte

run-name: "pmOS S8+ ${{ github.event.inputs.ui }} SECTOR4096-CLEAN-V1 #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "User interface"
        required: true
        default: "xfce4"
        type: choice
        options:
          - xfce4
          - phosh
          - console

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          sudo apt clean
          df -h

      - name: Install dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo sed -i 's|http://security.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          sudo apt-get update \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30

          sudo apt-get install -y --no-install-recommends \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            zip \
            rsync \
            openssh-client \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            android-tools-adb \
            android-tools-fastboot

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Initialize pmbootstrap with defaults
        run: |
          yes "" | pmbootstrap --details-to-stdout init

      - name: Configure target device
        run: |
          pmbootstrap config device samsung-dream
          pmbootstrap config kernel dream2lte
          pmbootstrap config user duy
          pmbootstrap config ui "${{ github.event.inputs.ui }}"
          pmbootstrap config hostname s8plus-pmos
          pmbootstrap config locale en_US.UTF-8
          pmbootstrap config timezone Asia/Ho_Chi_Minh
          pmbootstrap config jobs 2
          pmbootstrap config ccache_size 0
          pmbootstrap config extra_packages device-samsung-dream-nonfree-firmware,postmarketos-mkinitfs-hook-debug-shell
          pmbootstrap config build_pkgs_on_install True || true
          pmbootstrap config ssh_keys False || true

      - name: Patch samsung-dream sector size and debug shell
        shell: bash
        run: |
          set -euxo pipefail

          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"

          DEVICEINFO="$(find "$PMAPORTS/device" -path "*/device-samsung-dream/deviceinfo" -print -quit)"
          APKBUILD="$(find "$PMAPORTS/device" -path "*/device-samsung-dream/APKBUILD" -print -quit)"

          echo "DEVICEINFO=$DEVICEINFO"
          echo "APKBUILD=$APKBUILD"

          test -n "$DEVICEINFO"
          test -n "$APKBUILD"

          echo "Before patch:"
          cat "$DEVICEINFO"
          grep -n "deviceinfo_rootfs_image_sector_size\|deviceinfo_kernel_cmdline" "$DEVICEINFO" || true

          # Critical fix for Samsung userdata nested partition sector size.
          # Without this, pmOS initramfs searches wrong offsets and says:
          # "Waiting for boot partition" / "boot partition not found".
          if grep -q "^deviceinfo_rootfs_image_sector_size=" "$DEVICEINFO"; then
            sed -i 's/^deviceinfo_rootfs_image_sector_size=.*/deviceinfo_rootfs_image_sector_size="4096"/' "$DEVICEINFO"
          else
            echo 'deviceinfo_rootfs_image_sector_size="4096"' >> "$DEVICEINFO"
          fi

          # Do NOT force root=/dev/loop0p2 here.
          # That caused: "root partition does not contain a root filesystem".
          printf '%s\n' '' '# Forced debug build for boot diagnosis - SECTOR4096 clean build' 'deviceinfo_kernel_cmdline="${deviceinfo_kernel_cmdline:-} pmos.debug-shell PMOS_NO_OUTPUT_REDIRECT loglevel=7 rootwait PMOS_SECTOR4096_CLEAN_V1"' >> "$DEVICEINFO"

          echo "After patch:"
          cat "$DEVICEINFO"
          grep -n "deviceinfo_rootfs_image_sector_size\|deviceinfo_kernel_cmdline\|PMOS_SECTOR4096_CLEAN_V1" "$DEVICEINFO" || true

          echo "Bump pkgrel:"
          sed -i 's/^pkgrel=.*/pkgrel=4096/' "$APKBUILD"

          echo "Update checksum:"
          pmbootstrap --details-to-stdout checksum device-samsung-dream

          echo "Build patched device package for target arch aarch64:"
          pmbootstrap --details-to-stdout build --force --arch=aarch64 device-samsung-dream

          echo "Verify built aarch64 device APK contains sector 4096 marker:"

          echo "All matching APKs:"
          find "$HOME/.local/var/pmbootstrap/packages" -type f -name 'device-samsung-dream*.apk' | sort || true

          APK="$(find "$HOME/.local/var/pmbootstrap/packages" -type f -name 'device-samsung-dream-*.apk' \
            | grep '/aarch64/' \
            | grep -v 'nonfree-firmware' \
            | grep -v 'firmware' \
            | sort \
            | tail -n 1)"

          echo "APK=$APK"
          test -n "$APK"

          rm -rf /tmp/check-device-apk
          mkdir -p /tmp/check-device-apk
          tar -xzf "$APK" -C /tmp/check-device-apk

          echo "Extracted device APK files:"
          find /tmp/check-device-apk -type f | sort

          grep -Rsn 'deviceinfo_rootfs_image_sector_size="4096"\|PMOS_SECTOR4096_CLEAN_V1' /tmp/check-device-apk || {
            echo "ERROR: built aarch64 real device-samsung-dream APK does not contain sector 4096 patch"
            echo "APK checked: $APK"
            exit 1
          }

          echo "device-samsung-dream aarch64 APK sector patch OK"

      - name: Show pmbootstrap status and config
        run: |
          pmbootstrap status || true
          pmbootstrap config || true

      - name: Build Android recovery ZIP
        run: |
          pmbootstrap --details-to-stdout install \
            --android-recovery-zip \
            --recovery-install-partition=data \
            --no-fde \
            --password "123456"

      - name: Export files
        run: |
          mkdir -p out
          pmbootstrap export out
          find out -maxdepth 2 -type f -print
          ls -lh out

      - name: Rename and mark SECTOR4096 clean artifact
        shell: bash
        run: |
          set -euxo pipefail
          cd out

          echo "Before rename:"
          find . -maxdepth 1 -type f -print
          ls -lh

          test -f ./pmos-samsung-dream.zip

          mv ./pmos-samsung-dream.zip ./pmos-samsung-dream-SECTOR4096-CLEAN-V1.zip

          {
            echo "SECTOR4096_CLEAN_BUILD=YES"
            echo "NO_ROOT_LOOP0P2_CMDLINE=YES"
            echo "NO_FORCE_ROOT_V4=YES"
            echo "RUN_ID=${{ github.run_id }}"
            echo "RUN_NUMBER=${{ github.run_number }}"
            echo "UI=${{ github.event.inputs.ui }}"
            echo "DATE_UTC=$(date -u)"
          } > ./BUILD_MARKER_SECTOR4096_CLEAN_V1.txt

          echo "After rename:"
          find . -maxdepth 1 -type f -print
          ls -lh

      - name: Upload postmarketOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-samsung-dream2lte-${{ github.event.inputs.ui }}-SECTOR4096-CLEAN-V1
          path: out/**
          if-no-files-found: error
          retention-days: 7

name: Build postmarketOS for Galaxy S8 Plus dream2lte

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "User interface"
        required: true
        default: "xfce4"
        type: choice
        options:
          - xfce4
          - phosh
          - console

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          sudo apt clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            zip \
            rsync \
            openssh-client \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            android-tools-adb \
            android-tools-fastboot

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Initialize pmbootstrap with defaults
        run: |
          yes "" | pmbootstrap --details-to-stdout init

      - name: Configure target device
        run: |
          pmbootstrap config device samsung-dream
          pmbootstrap config kernel dream2lte
          pmbootstrap config user duy
          pmbootstrap config ui "${{ github.event.inputs.ui }}"
          pmbootstrap config hostname s8plus-pmos
          pmbootstrap config locale en_US.UTF-8
          pmbootstrap config timezone Asia/Ho_Chi_Minh
          pmbootstrap config jobs 2
          pmbootstrap config ccache_size 0
          pmbootstrap config extra_packages device-samsung-dream-nonfree-firmware
          pmbootstrap config build_pkgs_on_install True || true
          pmbootstrap config ssh_keys False || true

      - name: Patch pmbootstrap single-partition guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = Path.home() / "pmbootstrap" / "pmb" / "install" / "_install.py"
          print("Patching:", target)

          text = target.read_text()

          old = 'raise RuntimeError("--single-partition does not work for devices with initramfs-extra")'
          new = 'print("WARNING: ignored initramfs-extra single-partition guard for samsung-dream debug build")'

          if old not in text:
              print("Old guard not found. Showing matching lines:")
              for i, line in enumerate(text.splitlines(), 1):
                  if "single-partition" in line or "initramfs-extra" in line:
                      print(i, line)
              raise SystemExit(1)

          text = text.replace(old, new)
          target.write_text(text)

          print("Patch applied. Matching lines now:")
          for i, line in enumerate(target.read_text().splitlines(), 1):
              if "single-partition" in line or "initramfs-extra" in line:
                  print(i, line)
          PY

      - name: Patch samsung-dream deviceinfo as best effort
        shell: bash
        run: |
          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"

          echo "Finding samsung-dream deviceinfo files..."
          find "$PMAPORTS" -path "*device-samsung-dream*" -type f -name "deviceinfo*" -print || true

          while IFS= read -r f; do
            echo "Patching: $f"
            sed -i -E 's/^(deviceinfo_create_initfs_extra[^=]*=).*/\1"false"/' "$f" || true
            {
              echo ''
              echo '# Forced by debug workflow'
              echo 'deviceinfo_create_initfs_extra="false"'
              echo 'deviceinfo_create_initfs_extra_dream2lte="false"'
            } >> "$f"
          done < <(find "$PMAPORTS" -path "*device-samsung-dream*" -type f -name "deviceinfo*")

          echo "After patch:"
          grep -Rni "deviceinfo_create_initfs_extra" "$PMAPORTS/device" | grep -i "samsung-dream" || true

      - name: Show pmbootstrap status and config
        run: |
          pmbootstrap status || true
          pmbootstrap config || true

      - name: Build Android recovery ZIP
        run: |
          pmbootstrap --details-to-stdout install \
            --android-recovery-zip \
            --recovery-install-partition=data \
            --single-partition \
            --no-fde \
            --password "123456"

      - name: Export files
        run: |
          mkdir -p out
          pmbootstrap export out
          find out -maxdepth 2 -type f -print
          ls -lh out

      - name: Upload postmarketOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-samsung-dream2lte-${{ github.event.inputs.ui }}
          path: out/**
          if-no-files-found: error
          retention-days: 7

name: Build postmarketOS for Galaxy S8 Plus dream2lte

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "User interface"
        required: true
        default: "xfce4"
        type: choice
        options:
          - xfce4
          - phosh
          - console
      channel:
        description: "postmarketOS channel"
        required: true
        default: "edge"
        type: choice
        options:
          - edge
          - v24.12

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            zip \
            rsync \
            openssh-client \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            expect \
            android-tools-adb \
            android-tools-fastboot

      - name: Install pmbootstrap
        run: |
          python3 -m venv "$HOME/pmb-venv"
          source "$HOME/pmb-venv/bin/activate"
          pip install --upgrade pip
          pip install pmbootstrap
          echo "$HOME/pmb-venv/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Initialize pmbootstrap for Samsung Galaxy S8 Plus
        shell: bash
        run: |
          cat > init-pmbootstrap.expect <<'EOF'
          #!/usr/bin/expect -f
          set timeout -1
          spawn pmbootstrap --details-to-stdout init

          expect {
            -re {Work path.*:} {
              send "\r"
              exp_continue
            }
            -re {release channel.*:|Channel.*:|Choose.*channel.*:} {
              send "$env(PMOS_CHANNEL)\r"
              exp_continue
            }
            -re {Vendor.*:} {
              send "samsung\r"
              exp_continue
            }
            -re {Device codename.*:|Device.*:} {
              send "dream\r"
              exp_continue
            }
            -re {.*dream2lte.*variant.*:|.*kernel.*dream2lte.*:|.*dreamlte.*dream2lte.*:} {
              send "dream2lte\r"
              exp_continue
            }
            -re {Username.*:|User.*:} {
              send "duy\r"
              exp_continue
            }
            -re {Provider.*:|Wi-Fi.*backend.*:|Network.*provider.*:} {
              send "\r"
              exp_continue
            }
            -re {User interface.*:|Interface.*:|UI.*:} {
              send "$env(PMOS_UI)\r"
              exp_continue
            }
            -re {Extra packages.*:|Additional packages.*:} {
              send "\r"
              exp_continue
            }
            -re {non-free.*firmware.*:|firmware.*nonfree.*:|Install.*firmware.*:} {
              send "y\r"
              exp_continue
            }
            -re {Change.*mirror.*:|Use this timezone.*:|Build outdated packages.*:|Enable background timer.*:|Extra free space.*:|Boot partition size.*:|Parallel jobs.*:|ccache.*:} {
              send "\r"
              exp_continue
            }
            eof
          }
          EOF

          chmod +x init-pmbootstrap.expect
          PMOS_UI="${{ github.event.inputs.ui }}" PMOS_CHANNEL="${{ github.event.inputs.channel }}" ./init-pmbootstrap.expect

      - name: Show pmbootstrap config
        run: |
          pmbootstrap status || true
          pmbootstrap config || true

      - name: Build Android recovery ZIP
        run: |
          pmbootstrap --details-to-stdout install --android-recovery-zip

      - name: Export files
        run: |
          mkdir -p out
          pmbootstrap export out
          find out -maxdepth 2 -type f -print
          ls -lh out

      - name: Upload postmarketOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-samsung-dream2lte-${{ github.event.inputs.ui }}
          path: out/**
          if-no-files-found: error
          retention-days: 7

name: Build postmarketOS for Galaxy S8 Plus dream2lte

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "User interface"
        required: true
        default: "xfce4"
        type: choice
        options:
          - xfce4
          - phosh
          - console

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          sudo apt clean
          df -h

      - name: Install dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo sed -i 's|http://security.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          sudo apt-get update \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30

          sudo apt-get install -y --no-install-recommends \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            zip \
            rsync \
            openssh-client \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            android-tools-adb \
            android-tools-fastboot

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Initialize pmbootstrap with defaults
        run: |
          yes "" | pmbootstrap --details-to-stdout init

      - name: Configure target device
        run: |
          pmbootstrap config device samsung-dream
          pmbootstrap config kernel dream2lte
          pmbootstrap config user duy
          pmbootstrap config ui "${{ github.event.inputs.ui }}"
          pmbootstrap config hostname s8plus-pmos
          pmbootstrap config locale en_US.UTF-8
          pmbootstrap config timezone Asia/Ho_Chi_Minh
          pmbootstrap config jobs 2
          pmbootstrap config ccache_size 0
          pmbootstrap config extra_packages device-samsung-dream-nonfree-firmware,postmarketos-mkinitfs-hook-debug-shell
          pmbootstrap config build_pkgs_on_install True || true
          pmbootstrap config ssh_keys False || true

      - name: Patch samsung-dream sector size and debug shell
        shell: bash
        run: |
          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"

          DEVICEINFO="$(find "$PMAPORTS/device" -path "*/device-samsung-dream/deviceinfo" -print -quit)"
          APKBUILD="$(find "$PMAPORTS/device" -path "*/device-samsung-dream/APKBUILD" -print -quit)"

          echo "DEVICEINFO=$DEVICEINFO"
          echo "APKBUILD=$APKBUILD"

          test -n "$DEVICEINFO"
          test -n "$APKBUILD"

          echo "Before patch:"
          grep -n "deviceinfo_rootfs_image_sector_size\|deviceinfo_kernel_cmdline" "$DEVICEINFO" || true

          if grep -q "^deviceinfo_rootfs_image_sector_size=" "$DEVICEINFO"; then
            sed -i 's/^deviceinfo_rootfs_image_sector_size=.*/deviceinfo_rootfs_image_sector_size="4096"/' "$DEVICEINFO"
          else
            echo 'deviceinfo_rootfs_image_sector_size="4096"' >> "$DEVICEINFO"
          fi

          printf '%s\n' '' '# Forced debug build for boot diagnosis' 'deviceinfo_kernel_cmdline="${deviceinfo_kernel_cmdline:-} pmos.debug-shell PMOS_NO_OUTPUT_REDIRECT loglevel=7"' >> "$DEVICEINFO"

          echo "After patch:"
          grep -n "deviceinfo_rootfs_image_sector_size\|deviceinfo_kernel_cmdline" "$DEVICEINFO" || true

          echo "Bump pkgrel:"
          sed -i 's/^pkgrel=.*/pkgrel=999/' "$APKBUILD"

          echo "Update checksum and rebuild device package:"
          pmbootstrap --details-to-stdout checksum device-samsung-dream
          pmbootstrap --details-to-stdout build --force device-samsung-dream

      - name: Show pmbootstrap status and config
        run: |
          pmbootstrap status || true
          pmbootstrap config || true

      - name: Add initramfs boot log hook
        shell: bash
        run: |
          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          PKGDIR="$PMAPORTS/main/postmarketos-mkinitfs"
          APKBUILD="$PKGDIR/APKBUILD"

          echo "PKGDIR=$PKGDIR"
          echo "APKBUILD=$APKBUILD"

          test -d "$PKGDIR"
          test -f "$APKBUILD"

          python3 - <<'PY'
          from pathlib import Path

          pkgdir = Path.home() / ".local/var/pmbootstrap/cache_git/pmaports/main/postmarketos-mkinitfs"
          hook = pkgdir / "99-samsung-dream-bootlog.sh"
          apkbuild = pkgdir / "APKBUILD"
          
          hook.write_text("""#!/bin/sh
          
          LOG="/tmp/pmos-boot-debug.txt"
          
          echo "=== samsung-dream initramfs bootlog start ===" > "$LOG"
          date >> "$LOG" 2>&1 || true
          
          echo "--- cmdline ---" >> "$LOG"
          cat /proc/cmdline >> "$LOG" 2>&1 || true
          
          echo "--- block devices before loop ---" >> "$LOG"
          ls -lah /dev/block >> "$LOG" 2>&1 || true
          blkid >> "$LOG" 2>&1 || true
          
          mkdir -p /dev/block 2>/dev/null || true
          [ -b /dev/block/loop0 ] || mknod /dev/block/loop0 b 7 0 2>/dev/null || true
          [ -b /dev/block/loop1 ] || mknod /dev/block/loop1 b 7 1 2>/dev/null || true
          
          PMOS_DATA=""
          
          for candidate in /dev/block/sda24 /dev/sda24 /dev/block/platform/*/sda24 /dev/block/platform/*/*/sda24; do
              if [ -b "$candidate" ]; then
                  PMOS_DATA="$candidate"
                  break
              fi
          done
          
          echo "--- userdata candidate ---" >> "$LOG"
          echo "$PMOS_DATA" >> "$LOG"
          
          if [ -n "$PMOS_DATA" ]; then
              losetup -d /dev/block/loop0 2>/dev/null || true
              losetup -d /dev/block/loop1 2>/dev/null || true
              losetup -o 8388608 /dev/block/loop0 "$PMOS_DATA" 2>/dev/null || true
              losetup -o 255852544 /dev/block/loop1 "$PMOS_DATA" 2>/dev/null || true
          fi
          
          echo "--- loop status ---" >> "$LOG"
          losetup -a >> "$LOG" 2>&1 || true
          blkid /dev/block/loop0 /dev/block/loop1 >> "$LOG" 2>&1 || true
          
          echo "--- mount attempt pmOS_boot ---" >> "$LOG"
          mkdir -p /mnt/pmosboot 2>/dev/null || true
          mount /dev/block/loop0 /mnt/pmosboot >> "$LOG" 2>&1 || true
          
          echo "=== samsung-dream initramfs bootlog end ===" >> "$LOG"
          
          if [ -d /mnt/pmosboot ]; then
              cp "$LOG" /mnt/pmosboot/pmos-boot-debug.txt 2>/dev/null || true
              sync
          fi
          """)
          
          hook.chmod(0o755)
          
          text = apkbuild.read_text()
          
          source_line = 'source="$source 99-samsung-dream-bootlog.sh"'
          install_line = '    install -Dm755 "$srcdir"/99-samsung-dream-bootlog.sh "$pkgdir"/usr/share/mkinitfs/hooks/99-samsung-dream-bootlog.sh'
          
          if source_line not in text:
              text += "\n# samsung-dream bootlog debug hook\n" + source_line + "\n"
          
          if install_line not in text:
              lines = text.splitlines()
              out = []
              in_package = False
              inserted = False
          
              for line in lines:
                  if line.startswith("package()"):
                      in_package = True
          
                  if in_package and line.strip() == "}" and not inserted:
                      out.append(install_line)
                      inserted = True
          
                  out.append(line)
          
              if not inserted:
                  raise SystemExit("Could not patch package() function in APKBUILD")
          
              text = "\n".join(out) + "\n"
          
          apkbuild.write_text(text)
          PY
          
                    echo "Bump pkgrel:"
                    sed -i 's/^pkgrel=.*/pkgrel=999/' "$APKBUILD"
          
                    echo "Show APKBUILD patch:"
                    grep -n "99-samsung-dream-bootlog.sh\|pkgrel\|source=\|mkinitfs/hooks" "$APKBUILD" || true
          
                    echo "Update checksum:"
                    pmbootstrap --details-to-stdout checksum postmarketos-mkinitfs
          
                    echo "Build patched postmarketos-mkinitfs:"
                    pmbootstrap --details-to-stdout build --force postmarketos-mkinitfs
          
                - name: Build Android recovery ZIP
                  run: |
                    pmbootstrap --details-to-stdout install \
                      --android-recovery-zip \
                      --recovery-install-partition=data \
                      --no-fde \
                      --password "123456"
          
                - name: Export files
                  run: |
                    mkdir -p out
                    pmbootstrap export out
                    find out -maxdepth 2 -type f -print
                    ls -lh out
          
                - name: Upload postmarketOS artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: postmarketOS-samsung-dream2lte-${{ github.event.inputs.ui }}
                    path: out/**
                    if-no-files-found: error
                    retention-days: 7

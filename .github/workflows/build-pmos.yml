name: Build postmarketOS for Galaxy S8 Plus dream2lte

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "User interface"
        required: true
        default: "xfce4"
        type: choice
        options:
          - xfce4
          - phosh
          - console
      channel:
        description: "postmarketOS channel"
        required: true
        default: "edge"
        type: choice
        options:
          - edge
          - v24.12

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          sudo apt clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            zip \
            rsync \
            openssh-client \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            android-tools-adb \
            android-tools-fastboot

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pmbootstrap" --version

      - name: Create pmbootstrap config directly
        shell: bash
        run: |
          mkdir -p "$HOME/.config"
          mkdir -p "$HOME/.local/var/pmbootstrap"

          cat > "$HOME/.config/pmbootstrap.cfg" <<EOF
          [pmbootstrap]
          work = /home/runner/.local/var/pmbootstrap
          device = samsung-dream
          kernel = dream2lte
          user = duy
          ui = ${{ github.event.inputs.ui }}
          extra_packages =
          hostname = s8plus-pmos
          jobs = 2
          ccache_size = 0
          nonfree_firmware = True
          nonfree_userland = False
          build_pkgs_on_install = False
          ssh_keys = False
          timezone = Asia/Ho_Chi_Minh
          locale = en_US.UTF-8
          keymap =
          boot_size = 512
          extra_space = 512
          sudo_timer = False
          is_default_channel = False

          [providers]
          EOF

          echo "Created config:"
          cat "$HOME/.config/pmbootstrap.cfg"

      - name: Initialize pmbootstrap using config
        run: |
          pmbootstrap --details-to-stdout init <<EOF

          ${{ github.event.inputs.channel }}
          samsung
          dream
          dream2lte
          y
          duy
          iwd
          ${{ github.event.inputs.ui }}

          en_US.UTF-8
          s8plus-pmos
          n
          n
          y
          EOF

      - name: Force correct config after init
        shell: bash
        run: |
          python3 - <<'PY'
          from configparser import ConfigParser
          from pathlib import Path

          cfg_path = Path.home() / ".config" / "pmbootstrap.cfg"
          cfg = ConfigParser()
          cfg.read(cfg_path)

          if not cfg.has_section("pmbootstrap"):
              cfg.add_section("pmbootstrap")

          values = {
              "work": "/home/runner/.local/var/pmbootstrap",
              "device": "samsung-dream",
              "kernel": "dream2lte",
              "user": "duy",
              "ui": "${{ github.event.inputs.ui }}",
              "extra_packages": "",
              "hostname": "s8plus-pmos",
              "jobs": "2",
              "ccache_size": "0",
              "nonfree_firmware": "True",
              "nonfree_userland": "False",
              "build_pkgs_on_install": "False",
              "ssh_keys": "False",
              "timezone": "Asia/Ho_Chi_Minh",
              "locale": "en_US.UTF-8",
              "keymap": "",
              "boot_size": "512",
              "extra_space": "512",
              "sudo_timer": "False",
              "is_default_channel": "False",
          }

          for k, v in values.items():
              cfg.set("pmbootstrap", k, v)

          if not cfg.has_section("providers"):
              cfg.add_section("providers")

          with open(cfg_path, "w") as f:
              cfg.write(f)

          print(cfg_path.read_text())
          PY

      - name: Show pmbootstrap status and config
        run: |
          pmbootstrap status || true
          pmbootstrap config || true
          cat "$HOME/.config/pmbootstrap.cfg"

      - name: Build Android recovery ZIP
        run: |
          pmbootstrap --details-to-stdout install --android-recovery-zip --no-fde

      - name: Export files
        run: |
          mkdir -p out
          pmbootstrap export out
          find out -maxdepth 2 -type f -print
          ls -lh out

      - name: Upload postmarketOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-samsung-dream2lte-${{ github.event.inputs.ui }}
          path: out/**
          if-no-files-found: error
          retention-days: 7

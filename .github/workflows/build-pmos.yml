name: Build postmarketOS for Galaxy S8 Plus dream2lte

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "User interface"
        required: true
        default: "xfce4"
        type: choice
        options:
          - xfce4
          - phosh
          - console

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          sudo apt clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            zip \
            rsync \
            openssh-client \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            android-tools-adb \
            android-tools-fastboot

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Initialize pmbootstrap with defaults
        run: |
          yes "" | pmbootstrap --details-to-stdout init

      - name: Configure target device
        run: |
          pmbootstrap config device samsung-dream
          pmbootstrap config kernel dream2lte
          pmbootstrap config user duy
          pmbootstrap config ui "${{ github.event.inputs.ui }}"
          pmbootstrap config hostname s8plus-pmos
          pmbootstrap config locale en_US.UTF-8
          pmbootstrap config timezone Asia/Ho_Chi_Minh
          pmbootstrap config jobs 2
          pmbootstrap config ccache_size 0
          pmbootstrap config extra_packages device-samsung-dream-nonfree-firmware
          pmbootstrap config build_pkgs_on_install True || true
          pmbootstrap config ssh_keys False || true

      - name: Force disable initramfs-extra for samsung-dream
        shell: bash
        run: |
          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"

          echo "Finding samsung-dream deviceinfo files..."
          find "$PMAPORTS" -path "*device-samsung-dream*" -type f -name "deviceinfo*" -print

          for f in $(find "$PMAPORTS" -path "*device-samsung-dream*" -type f -name "deviceinfo*"); do
            echo "----- BEFORE: $f -----"
            grep -n "deviceinfo_create_initfs_extra" "$f" || true

            if grep -q "^deviceinfo_create_initfs_extra=" "$f"; then
              sed -i 's/^deviceinfo_create_initfs_extra=.*/deviceinfo_create_initfs_extra="false"/' "$f"
            else
              echo 'deviceinfo_create_initfs_extra="false"' >> "$f"
            fi

            echo "----- AFTER: $f -----"
            grep -n "deviceinfo_create_initfs_extra" "$f" || true
          done

      - name: Force rebuild patched device package
        run: |
          pmbootstrap --details-to-stdout build --force device-samsung-dream || \
          pmbootstrap --details-to-stdout build -f device-samsung-dream || \
          pmbootstrap --details-to-stdout build device-samsung-dream

      - name: Show pmbootstrap status and config
        run: |
          pmbootstrap status || true
          pmbootstrap config || true

      - name: Build Android recovery ZIP
        run: |
          pmbootstrap --details-to-stdout install \
            --android-recovery-zip \
            --recovery-install-partition=data \
            --single-partition \
            --no-fde \
            --password "123456"

      - name: Export files
        run: |
          mkdir -p out
          pmbootstrap export out
          find out -maxdepth 2 -type f -print
          ls -lh out

      - name: Upload postmarketOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-samsung-dream2lte-${{ github.event.inputs.ui }}
          path: out/**
          if-no-files-found: error
          retention-days: 7

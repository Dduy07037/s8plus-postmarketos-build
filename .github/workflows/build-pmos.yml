name: Build postmarketOS for Galaxy S8 Plus dream2lte

run-name: "pmOS S8+ ${{ github.event.inputs.ui }} FORCE-ROOT-V3 #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "User interface"
        required: true
        default: "xfce4"
        type: choice
        options:
          - xfce4
          - phosh
          - console

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          sudo apt clean
          df -h

      - name: Install dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo sed -i 's|http://security.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          sudo apt-get update \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30

          sudo apt-get install -y --no-install-recommends \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            zip \
            rsync \
            openssh-client \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            android-tools-adb \
            android-tools-fastboot

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Initialize pmbootstrap with defaults
        run: |
          yes "" | pmbootstrap --details-to-stdout init

      - name: Configure target device
        run: |
          pmbootstrap config device samsung-dream
          pmbootstrap config kernel dream2lte
          pmbootstrap config user duy
          pmbootstrap config ui "${{ github.event.inputs.ui }}"
          pmbootstrap config hostname s8plus-pmos
          pmbootstrap config locale en_US.UTF-8
          pmbootstrap config timezone Asia/Ho_Chi_Minh
          pmbootstrap config jobs 2
          pmbootstrap config ccache_size 0
          pmbootstrap config extra_packages device-samsung-dream-nonfree-firmware,postmarketos-mkinitfs-hook-debug-shell
          pmbootstrap config build_pkgs_on_install True || true
          pmbootstrap config ssh_keys False || true

      - name: Patch samsung-dream sector size and debug shell
        shell: bash
        run: |
          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"

          DEVICEINFO="$(find "$PMAPORTS/device" -path "*/device-samsung-dream/deviceinfo" -print -quit)"
          APKBUILD="$(find "$PMAPORTS/device" -path "*/device-samsung-dream/APKBUILD" -print -quit)"

          echo "DEVICEINFO=$DEVICEINFO"
          echo "APKBUILD=$APKBUILD"

          test -n "$DEVICEINFO"
          test -n "$APKBUILD"

          echo "Before patch:"
          grep -n "deviceinfo_rootfs_image_sector_size\|deviceinfo_kernel_cmdline" "$DEVICEINFO" || true

          if grep -q "^deviceinfo_rootfs_image_sector_size=" "$DEVICEINFO"; then
            sed -i 's/^deviceinfo_rootfs_image_sector_size=.*/deviceinfo_rootfs_image_sector_size="4096"/' "$DEVICEINFO"
          else
            echo 'deviceinfo_rootfs_image_sector_size="4096"' >> "$DEVICEINFO"
          fi

          printf '%s\n' '' '# Forced debug build for boot diagnosis' 'deviceinfo_kernel_cmdline="${deviceinfo_kernel_cmdline:-} pmos.debug-shell PMOS_NO_OUTPUT_REDIRECT loglevel=7 rootwait root=/dev/loop0p2 pmos_root=/dev/loop0p2 rootfstype=ext4"' >> "$DEVICEINFO"

          echo "After patch:"
          grep -n "deviceinfo_rootfs_image_sector_size\|deviceinfo_kernel_cmdline" "$DEVICEINFO" || true

          echo "Bump pkgrel:"
          sed -i 's/^pkgrel=.*/pkgrel=999/' "$APKBUILD"

          echo "Update checksum and rebuild device package:"
          pmbootstrap --details-to-stdout checksum device-samsung-dream
          pmbootstrap --details-to-stdout build --force device-samsung-dream

      - name: Show pmbootstrap status and config
        run: |
          pmbootstrap status || true
          pmbootstrap config || true

      - name: Patch postmarketos-initramfs root handoff for samsung-dream v3
        shell: bash
        run: |
          set -euxo pipefail

          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          PKGDIR="$PMAPORTS/main/postmarketos-initramfs"
          FUN="$PKGDIR/init_functions.sh"
          APKBUILD="$PKGDIR/APKBUILD"

          echo "PKGDIR=$PKGDIR"
          echo "FUN=$FUN"
          echo "APKBUILD=$APKBUILD"

          test -d "$PKGDIR"
          test -f "$FUN"
          test -f "$APKBUILD"

          echo "Current root/mount/partition functions:"
          grep -nE "^[a-zA-Z0-9_]+[[:space:]]*\(\)[[:space:]]*\{" "$FUN" | grep -E "root|mount|resize|partition|subpartition" || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          pkgdir = Path.home() / ".local/var/pmbootstrap/cache_git/pmaports/main/postmarketos-initramfs"
          fun = pkgdir / "init_functions.sh"

          text = fun.read_text()

          def rename_function(src: str, name: str, required: bool) -> str:
              if f"{name}_orig()" in src:
                  print(f"Already renamed: {name}()")
                  return src

              pattern = rf'(?m)^([ \t]*){re.escape(name)}[ \t]*\(\)[ \t]*\{{'
              if not re.search(pattern, src):
                  if required:
                      available = []
                      for m in re.finditer(r'(?m)^[ \t]*([A-Za-z0-9_]+)[ \t]*\(\)[ \t]*\{', src):
                          available.append(m.group(1))
                      raise SystemExit(
                          f"Required function not found: {name}(). "
                          f"Available functions: {', '.join(available)}"
                      )
                  print(f"Optional function not found, skipping rename: {name}()")
                  return src

              return re.sub(pattern, rf'\1{name}_orig() {{', src, count=1)

          text = rename_function(text, "find_root_partition", required=True)
          text = rename_function(text, "mount_root_partition", required=True)
          text = rename_function(text, "resize_root_partition", required=False)

          marker = "# samsung-dream force root handoff patch v3"
          if marker not in text:
              text += r'''

          # samsung-dream force root handoff patch v3
          # Galaxy S8/S8+ recovery ZIP installed into Android userdata.
          #
          # Known layout from safe bootlog:
          #   /dev/loop0p1 = pmOS_boot
          #   /dev/loop0p2 = pmOS_root
          #
          # Do not remap loop devices here. Only force root discovery and root mount.

          _samsung_dream_log() {
              msg="[samsung-dream-force-v3] $*"
              echo "$msg" >&2
              echo "$msg" >> /tmp/samsung-dream-root-handoff-v3.log 2>/dev/null || true

              if [ -e /dev/kmsg ]; then
                  echo "$msg" > /dev/kmsg 2>/dev/null || true
              fi
          }

          _samsung_dream_save_log_to_boot() {
              if grep -q " /boot " /proc/mounts 2>/dev/null; then
                  mount -o remount,rw /boot 2>/dev/null || true

                  {
                      echo
                      echo "===== samsung-dream root handoff debug v3 ====="
                      date 2>/dev/null || true

                      echo "--- cmdline ---"
                      cat /proc/cmdline 2>/dev/null || true

                      echo "--- partitions ---"
                      cat /proc/partitions 2>/dev/null || true

                      echo "--- blkid ---"
                      blkid 2>/dev/null || true

                      echo "--- losetup ---"
                      losetup -a 2>/dev/null || true

                      echo "--- mounts ---"
                      cat /proc/mounts 2>/dev/null || true

                      echo "--- root candidate ---"
                      _samsung_dream_root_candidate 2>/dev/null || true

                      echo "--- /sysroot ---"
                      ls -lah /sysroot 2>/dev/null || true

                      echo "--- temp log ---"
                      cat /tmp/samsung-dream-root-handoff-v3.log 2>/dev/null || true
                  } >> /boot/pmos-root-handoff-debug-v3.txt 2>&1 || true

                  sync 2>/dev/null || true
                  mount -o remount,ro /boot 2>/dev/null || true
              fi
          }

          _samsung_dream_root_candidate() {
              i=0
              while [ "$i" -lt 40 ]; do
                  for dev in \
                      /dev/loop0p2 \
                      /dev/disk/by-label/pmOS_root \
                      /dev/block/by-label/pmOS_root \
                      /dev/mapper/userdata2 \
                      /dev/dm-1
                  do
                      [ -b "$dev" ] || continue

                      if blkid "$dev" 2>/dev/null | grep -q 'LABEL="pmOS_root"'; then
                          echo "$dev"
                          return 0
                      fi
                  done

                  sleep 1
                  i=$((i + 1))
              done

              return 1
          }

          find_root_partition() {
              forced_root="$(_samsung_dream_root_candidate 2>/dev/null || true)"

              if [ -n "$forced_root" ]; then
                  _samsung_dream_log "forced find_root_partition=$forced_root"
                  echo "$forced_root"
                  return 0
              fi

              _samsung_dream_log "forced root candidate not found; fallback to original find_root_partition"
              find_root_partition_orig "$@"
          }

          resize_root_partition() {
              rootpart="$(find_root_partition 2>/dev/null || true)"

              case "$rootpart" in
                  /dev/loop0p2|/dev/disk/by-label/pmOS_root|/dev/block/by-label/pmOS_root|/dev/mapper/userdata2|/dev/dm-1)
                      _samsung_dream_log "skip resize_root_partition for nested userdata root: $rootpart"
                      return 0
                      ;;
              esac

              if command -v resize_root_partition_orig >/dev/null 2>&1; then
                  resize_root_partition_orig "$@"
              else
                  _samsung_dream_log "resize_root_partition_orig not present; skipping"
                  return 0
              fi
          }

          mount_root_partition() {
              rootpart="$(find_root_partition 2>/dev/null || true)"

              case "$rootpart" in
                  /dev/loop0p2|/dev/disk/by-label/pmOS_root|/dev/block/by-label/pmOS_root|/dev/mapper/userdata2|/dev/dm-1)
                      _samsung_dream_log "force mount root partition: $rootpart -> /sysroot"

                      root_partition="$rootpart"
                      export root_partition

                      mkdir -p /sysroot 2>/dev/null || true

                      if grep -q " /sysroot " /proc/mounts 2>/dev/null; then
                          _samsung_dream_log "/sysroot already mounted, unmounting first"
                          umount /sysroot 2>/dev/null || true
                      fi

                      _samsung_dream_log "blkid root: $(blkid "$rootpart" 2>/dev/null || true)"

                      mount -t ext4 -o rw "$rootpart" /sysroot 2>/tmp/samsung-dream-mount-v3.err || \
                      mount -t ext4 -o ro "$rootpart" /sysroot 2>>/tmp/samsung-dream-mount-v3.err || {
                          _samsung_dream_log "mount failed for $rootpart"
                          cat /tmp/samsung-dream-mount-v3.err >> /tmp/samsung-dream-root-handoff-v3.log 2>/dev/null || true
                          _samsung_dream_save_log_to_boot
                          return 1
                      }

                      _samsung_dream_log "mount root OK"

                      mkdir -p /sysroot/var/log 2>/dev/null || true

                      {
                          echo "samsung-dream-force-v3: mounted root in initramfs"
                          date 2>/dev/null || true
                          echo "rootpart=$rootpart"

                          echo "--- cmdline ---"
                          cat /proc/cmdline 2>/dev/null || true

                          echo "--- blkid ---"
                          blkid 2>/dev/null || true

                          echo "--- losetup ---"
                          losetup -a 2>/dev/null || true

                          echo "--- mounts ---"
                          cat /proc/mounts 2>/dev/null || true

                          echo "--- /sysroot ---"
                          ls -lah /sysroot 2>/dev/null || true

                          echo "--- init candidates ---"
                          ls -lah /sysroot/sbin/init /sysroot/lib/systemd/systemd 2>/dev/null || true
                      } >> /sysroot/var/log/pmos-initramfs-mounted-root-v3.txt 2>&1 || true

                      if [ ! -e /sysroot/sbin/init ] && [ ! -e /sysroot/lib/systemd/systemd ]; then
                          _samsung_dream_log "root mounted but init/systemd not found"
                          _samsung_dream_save_log_to_boot
                          return 1
                      fi

                      sync 2>/dev/null || true
                      _samsung_dream_save_log_to_boot
                      return 0
                      ;;
              esac

              _samsung_dream_log "using original mount_root_partition for rootpart=$rootpart"
              mount_root_partition_orig "$@"
          }

          '''
          fun.write_text(text)
          PY

          echo "Show patched functions:"
          grep -n "samsung-dream-force-v3\|find_root_partition_orig\|mount_root_partition_orig\|resize_root_partition_orig" "$FUN" || true

          echo "Try to locate switch_root, but do not fail if layout changed:"
          grep -Rsn "switch_root" "$PKGDIR" || true

          echo "Bump pkgrel:"
          sed -i 's/^pkgrel=.*/pkgrel=999/' "$APKBUILD"

          echo "Update checksum:"
          pmbootstrap --details-to-stdout checksum postmarketos-initramfs

          echo "Build patched postmarketos-initramfs:"
          pmbootstrap --details-to-stdout build --force postmarketos-initramfs

      - name: Build Android recovery ZIP
        run: |
          pmbootstrap --details-to-stdout install \
            --android-recovery-zip \
            --recovery-install-partition=data \
            --no-fde \
            --password "123456"

      - name: Export files
        run: |
          mkdir -p out
          pmbootstrap export out
          find out -maxdepth 2 -type f -print
          ls -lh out

      - name: Rename exported ZIP with force-root marker
        shell: bash
        run: |
          set -euxo pipefail
          cd out

          echo "Before rename:"
          find . -maxdepth 1 -type f -print
          ls -lh

          test -f ./pmos-samsung-dream.zip

          mv ./pmos-samsung-dream.zip ./pmos-samsung-dream-force-root-v3.zip

          echo "FORCE_ROOT_V3_BUILD=YES" > ./BUILD_MARKER_FORCE_ROOT_V3.txt
          echo "UI=${{ github.event.inputs.ui }}" >> ./BUILD_MARKER_FORCE_ROOT_V3.txt
          echo "RUN_ID=${{ github.run_id }}" >> ./BUILD_MARKER_FORCE_ROOT_V3.txt
          echo "RUN_NUMBER=${{ github.run_number }}" >> ./BUILD_MARKER_FORCE_ROOT_V3.txt

          echo "After rename:"
          find . -maxdepth 1 -type f -print
          ls -lh

      - name: Upload postmarketOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-samsung-dream2lte-${{ github.event.inputs.ui }}-FORCE-ROOT-V3
          path: out/**
          if-no-files-found: error
          retention-days: 7

name: Build postmarketOS for Galaxy S8 Plus dream2lte

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "User interface"
        required: true
        default: "xfce4"
        type: choice
        options:
          - xfce4
          - phosh
          - console

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          sudo apt clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            zip \
            rsync \
            openssh-client \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            android-tools-adb \
            android-tools-fastboot

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Initialize pmbootstrap with defaults
        run: |
          yes "" | pmbootstrap --details-to-stdout init

      - name: Configure target device
        run: |
          pmbootstrap config device samsung-dream
          pmbootstrap config kernel dream2lte
          pmbootstrap config user duy
          pmbootstrap config ui "${{ github.event.inputs.ui }}"
          pmbootstrap config hostname s8plus-pmos
          pmbootstrap config locale en_US.UTF-8
          pmbootstrap config timezone Asia/Ho_Chi_Minh
          pmbootstrap config jobs 2
          pmbootstrap config ccache_size 0
          pmbootstrap config extra_packages device-samsung-dream-nonfree-firmware
          pmbootstrap config build_pkgs_on_install True || true
          pmbootstrap config ssh_keys False || true

      - name: Patch initramfs to map internal pmOS partitions
        shell: bash
        run: |
          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"

          echo "=== Search initramfs files ==="
          grep -Rni "boot partition not found\|Waiting for boot partition\|pmOS_boot" "$PMAPORTS" "$HOME/pmbootstrap" | head -300 || true

          python3 - <<'PY'
          from pathlib import Path

          search_roots = [
              Path.home() / ".local/var/pmbootstrap/cache_git/pmaports",
              Path.home() / "pmbootstrap",
          ]

          snippet = r'''
          # samsung-dream internal userdata partition workaround
          # USERDATA is /dev/block/sda24.
          # postmarketOS recovery installer creates a nested partition table:
          #   sda24p1 starts at 2048 sectors  * 4096 = 8388608 bytes      -> pmOS_boot
          #   sda24p2 starts at 62464 sectors * 4096 = 255852544 bytes    -> pmOS_root
          # This kernel/initramfs does not expose sda24p1/sda24p2 automatically,
          # so we map them manually with loop devices before searching pmOS_boot.
          if [ -b /dev/block/sda24 ]; then
              echo "samsung-dream: mapping pmOS partitions from /dev/block/sda24"

              mkdir -p /dev/block 2>/dev/null || true

              if [ ! -b /dev/block/loop0 ]; then
                  mknod /dev/block/loop0 b 7 0 2>/dev/null || true
              fi
              if [ ! -b /dev/block/loop1 ]; then
                  mknod /dev/block/loop1 b 7 1 2>/dev/null || true
              fi

              LOOP0="/dev/block/loop0"
              LOOP1="/dev/block/loop1"

              if [ ! -b "$LOOP0" ] && [ -b /dev/loop0 ]; then
                  LOOP0="/dev/loop0"
              fi
              if [ ! -b "$LOOP1" ] && [ -b /dev/loop1 ]; then
                  LOOP1="/dev/loop1"
              fi

              losetup -d "$LOOP0" 2>/dev/null || true
              losetup -d "$LOOP1" 2>/dev/null || true

              losetup -o 8388608 "$LOOP0" /dev/block/sda24 2>/dev/null || busybox losetup -o 8388608 "$LOOP0" /dev/block/sda24 2>/dev/null || true
              losetup -o 255852544 "$LOOP1" /dev/block/sda24 2>/dev/null || busybox losetup -o 255852544 "$LOOP1" /dev/block/sda24 2>/dev/null || true

              echo "samsung-dream: mapped loop devices:"
              losetup -a 2>/dev/null || busybox losetup -a 2>/dev/null || true
              blkid "$LOOP0" "$LOOP1" 2>/dev/null || true
          fi
          '''

          candidates = []

          for root in search_roots:
              if not root.exists():
                  continue

              for p in root.rglob("*"):
                  if not p.is_file():
                      continue

                  try:
                      text = p.read_text(errors="ignore")
                  except Exception:
                      continue

                  if (
                      "boot partition not found" in text
                      or "Waiting for boot partition" in text
                      or "pmOS_boot" in text
                  ):
                      candidates.append(p)

          print("Candidates found:")
          for p in candidates:
              print(p)

          patched_files = []

          for p in candidates:
              text = p.read_text(errors="ignore")

              if "samsung-dream internal userdata partition workaround" in text:
                  continue

              markers = [
                  "Waiting for boot partition",
                  "boot partition not found",
                  "pmOS_boot",
              ]

              patched = False

              for marker in markers:
                  idx = text.find(marker)
                  if idx == -1:
                      continue

                  line_start = text.rfind("\n", 0, idx)
                  if line_start == -1:
                      line_start = 0

                  new_text = text[:line_start] + "\n" + snippet + "\n" + text[line_start:]
                  p.write_text(new_text)
                  patched = True
                  patched_files.append(p)
                  print("PATCHED:", p)
                  break

          if not patched_files:
              raise SystemExit("No initramfs/search file patched")

          print("Patched files:")
          for p in patched_files:
              print(p)
          PY

          echo "=== Patch verification ==="
          grep -Rni "samsung-dream internal userdata partition workaround\|losetup -o 8388608\|losetup -o 255852544" "$PMAPORTS" "$HOME/pmbootstrap" || true

      - name: Update checksums and rebuild patched packages
        shell: bash
        run: |
          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"

          echo "=== Find patched package directories ==="
          grep -Rli "samsung-dream internal userdata partition workaround" "$PMAPORTS" "$HOME/pmbootstrap" || true

          # Patch files in pmaports packages require checksum updates.
          for patched in $(grep -Rli "samsung-dream internal userdata partition workaround" "$PMAPORTS" || true); do
            dir="$(dirname "$patched")"

            while [ "$dir" != "$PMAPORTS" ] && [ "$dir" != "/" ]; do
              if [ -f "$dir/APKBUILD" ]; then
                pkg="$(basename "$dir")"
                echo "Package containing patch: $pkg"
                sed -i 's/^pkgrel=.*/pkgrel=999/' "$dir/APKBUILD" || true
                pmbootstrap --details-to-stdout checksum "$pkg" || true
                pmbootstrap --details-to-stdout build --force "$pkg" || true
                break
              fi
              dir="$(dirname "$dir")"
            done
          done

          # These are the most likely initramfs-related packages.
          pmbootstrap --details-to-stdout checksum postmarketos-mkinitfs || true
          pmbootstrap --details-to-stdout build --force postmarketos-mkinitfs || true
          pmbootstrap --details-to-stdout build --force postmarketos-initramfs || true
          pmbootstrap --details-to-stdout build --force postmarketos-base || true

      - name: Show pmbootstrap status and config
        run: |
          pmbootstrap status || true
          pmbootstrap config || true

      - name: Build Android recovery ZIP
        run: |
          pmbootstrap --details-to-stdout install \
            --android-recovery-zip \
            --recovery-install-partition=data \
            --no-fde \
            --password "123456"

      - name: Export files
        run: |
          mkdir -p out
          pmbootstrap export out
          find out -maxdepth 2 -type f -print
          ls -lh out

      - name: Upload postmarketOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-samsung-dream2lte-${{ github.event.inputs.ui }}
          path: out/**
          if-no-files-found: error
          retention-days: 7
